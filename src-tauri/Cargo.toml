[package]
name = "agent-config-manager"
version = "0.1.0"
description = "Agent Config Manager — single-user local cross-agent configuration workbench (MVP)"
edition = "2021"
rust-version = "1.85"

[lib]
name = "agent_config_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
log = "0.4"
dirs = "5"
toml = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
zip = "2.2"
tempfile = "3"
futures = "0.3"
indexmap = "2.7"
serde_yaml = "0.9"
url = "2"
chrono = "0.4"
tokio = { version = "1", features = ["time"] }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
serial_test = "3"

[features]
# L3 测试构建专用：把 WebDriver plugin 与测试 command 编译进 harness 二进制。
# 生产构建（默认 feature 集）物理不含这些能力（ARC-06c §3.15 测试构建隔离）。
test-harness = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
